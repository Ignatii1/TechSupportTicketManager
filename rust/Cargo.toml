[package]
name = "ticketboard-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "TicketBoard: прототип на Rust (размер, память, скорость)"

[lib]
name = "ticketboard"
path = "src/lib.rs"

[[bin]]
name = "ticketboard-rs"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# native-tls-no-default: корни — из хранилища Windows (SChannel), как у .NET, а не встроенный список Mozilla
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
base64 = "0.22"
# шаблон номера заявки из настроек (IntraserviceIdPattern): маленький движок, +83 КБ; полный regex — +1,44 МБ
regex-lite = "0.1.9"

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
